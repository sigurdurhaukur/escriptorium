[project]
name = "escriptorium-training"
version = "0.1.0"
description = "Local Kraken OCR training from eScriptorium data"
requires-python = ">=3.12"
dependencies = [
    "kraken~=7.0",
    "requests>=2.31",
    "numpy>=1.24",
    "datasets>=5.0",
    "dotenv>=0.9.9",
    "escriptorium-connector>=0.0.20",
]

[project.scripts]
escriptorium-train = "training.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "responses>=0.25",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icelandic OCR Demo</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <header>
        <h1>Icelandic OCR Demo</h1>
        <p>Upload a document image to run automatic segmentation and text recognition</p>
    </header>

    <main>
        <div class="upload-card">
            <form id="ocr-form">
                <label class="file-label">
                    <input type="file" name="file" accept="image/*,.pdf" required id="file-input">
                    <span id="file-name">Choose an image…</span>
                </label>
                <button type="submit" class="btn-primary" id="submit-btn">Run OCR</button>
            </form>
            <div id="upload-error" class="error-msg" style="display:none;margin-top:1rem"></div>
        </div>

        <div id="result"></div>
    </main>

    <script>
    (function () {
        var form = document.getElementById('ocr-form');
        var fileInput = document.getElementById('file-input');
        var submitBtn = document.getElementById('submit-btn');
        var resultEl = document.getElementById('result');
        var uploadError = document.getElementById('upload-error');
        var currentSrc = null;
        var currentJobId = null;
        var pendingDataUrl = null;
        var pdfPreviewToken = null;
        var pdfPages = null;
        var selectedPage = null;
        var isPdf = false;

        var LINE_WIDTHS = [89, 94, 82, 96, 78, 91, 85, 93, 75, 88, 94, 80, 87, 72, 90];

        function resetPdfState() {
            pdfPreviewToken = null;
            pdfPages = null;
            selectedPage = null;
            isPdf = false;
            var picker = document.getElementById('pdf-picker');
            if (picker) picker.remove();
            submitBtn.textContent = 'Run OCR';
        }

        fileInput.addEventListener('change', function () {
            var file = this.files[0];
            if (!file) return;
            document.getElementById('file-name').textContent = file.name;
            pendingDataUrl = null;
            uploadError.style.display = 'none';
            resetPdfState();

            if (file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf')) {
                isPdf = true;
                var reader = new FileReader();
                reader.onload = function (e) { pendingDataUrl = e.target.result; };
                reader.readAsDataURL(file);
                uploadPdfPreview(file);
                return;
            }

            var reader = new FileReader();
            reader.onload = function (e) { pendingDataUrl = e.target.result; };
            reader.readAsDataURL(file);
        });

        function uploadPdfPreview(file) {
            var formData = new FormData();
            formData.append('file', file);

            var card = document.querySelector('.upload-card');
            var existing = document.getElementById('pdf-picker');
            if (existing) existing.remove();

            var picker = document.createElement('div');
            picker.id = 'pdf-picker';
            picker.className = 'pdf-picker';
            picker.innerHTML = '<div class="pdf-picker-loading">Loading page previews…</div>';
            card.appendChild(picker);

            fetch('/pdf-preview', { method: 'POST', body: formData })
                .then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error(d.detail || d.error || 'Preview failed'); return d; }); })
                .then(function (data) {
                    pdfPreviewToken = data.token;
                    pdfPages = data.pages;
                    renderPdfGrid(data.pages);
                })
                .catch(function (err) {
                    picker.innerHTML = '<div class="pdf-picker-error">' + err.message + '</div>';
                });
        }

        function renderPdfGrid(pages) {
            var picker = document.getElementById('pdf-picker');
            if (!picker) return;

            var html = '<p class="pdf-picker-title">Select a page to OCR:</p>';
            html += '<div class="pdf-picker-grid">';
            for (var i = 0; i < pages.length; i++) {
                html += '<button class="pdf-page-option" data-page="' + pages[i].page + '">' +
                    '<img src="' + pages[i].thumbnail + '" alt="Page ' + pages[i].page + '" loading="lazy">' +
                    '<div class="pdf-page-option-label">Page ' + pages[i].page + '</div>' +
                    '</button>';
            }
            html += '</div>';
            html += '<div class="pdf-picker-actions">' +
                '<span style="font-size:0.85rem;color:#64748b" id="pdf-selected">Select a page above</span>' +
                '<button class="btn-primary" id="pdf-submit-btn" disabled>OCR this page</button>' +
                '</div>';
            picker.innerHTML = html;

            picker.querySelectorAll('.pdf-page-option').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    picker.querySelectorAll('.pdf-page-option').forEach(function (b) { b.classList.remove('selected'); });
                    btn.classList.add('selected');
                    selectedPage = parseInt(btn.dataset.page);
                    document.getElementById('pdf-selected').textContent = 'Page ' + selectedPage + ' selected';
                    document.getElementById('pdf-submit-btn').disabled = false;
                });
            });

            document.getElementById('pdf-submit-btn').addEventListener('click', function () {
                if (selectedPage) submitPdfPage(selectedPage);
            });
        }

        function submitPdfPage(page) {
            if (currentSrc) { currentSrc.close(); currentSrc = null; }
            var thumb = pdfPages ? pdfPages.find(function (p) { return p.page === page; }) : null;
            showSkeleton(thumb ? thumb.thumbnail : null);
            submitBtn.disabled = true;

            var formData = new FormData();
            formData.append('preview_token', pdfPreviewToken);
            formData.append('page_number', page);

            fetch('/transcribe', { method: 'POST', body: formData })
                .then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error(d.detail || d.error || 'OCR failed'); return d; }); })
                .then(function (data) {
                    currentJobId = data.job_id;
                    showCancelButton(data.job_id);
                    if (data.queue_position && data.queue_position > 1) {
                        setStatus('Position ' + data.queue_position + ' in queue…');
                    } else if (!data.cached) {
                        setStatus('Segmenting document…');
                    }
                    startStream(data.job_id);
                })
                .catch(function (err) {
                    resultEl.innerHTML = '';
                    uploadError.textContent = err.message;
                    uploadError.style.display = '';
                    submitBtn.disabled = false;
                });
        }

        var ICONS = {
            copy: '<i class="fa-regular fa-copy"></i>',
            check: '<i class="fa-solid fa-check"></i>',
            download: '<i class="fa-solid fa-download"></i>',
            thumbsUp: '<i class="fa-regular fa-thumbs-up"></i>',
            thumbsDown: '<i class="fa-regular fa-thumbs-down"></i>',
        };

        function showSkeleton(dataUrl) {
            var bars = LINE_WIDTHS.map(function (w) {
                return '<div class="skeleton-bar" style="width:' + w + '%"></div>';
            }).join('');

            resultEl.innerHTML =
                '<div class="result-section">' +
                    '<div class="result-meta">' +
                        '<span id="line-count" data-count="0">Waiting…</span>' +
                        '<div>' +
                            '<span id="confidence-display" class="confidence-badge" style="display:none"></span>' +
                            '<button id="cancel-btn" class="btn-cancel" style="display:none">Cancel</button>' +
                        '</div>' +
                    '</div>' +
                    '<div class="dual-view">' +
                        '<div class="view-panel">' +
                            '<div class="panel-label">Original</div>' +
                            '<div class="image-container">' +
                                '<img src="' + dataUrl + '" alt="Document">' +
                            '</div>' +
                        '</div>' +
                        '<div class="view-panel">' +
                            '<div class="panel-label">Transcription</div>' +
                            '<div class="image-container" id="transcription-panel">' +
                                '<div class="skeleton-transcription">' + bars + '</div>' +
                            '</div>' +
                        '</div>' +
                    '</div>' +
                    '<div class="plain-text">' +
                        '<div class="plain-text-header">' +
                            '<h3>Extracted text</h3>' +
                            '<div class="plain-text-actions">' +
                                '<button class="btn-icon" id="copy-btn" title="Copy text">' +
                                    '<span class="icon-copy">' + ICONS.copy + '</span>' +
                                    '<span class="icon-check">' + ICONS.check + '</span>' +
                                '</button>' +
                                '<button class="btn-icon" id="download-btn" title="Download as text file">' + ICONS.download + '</button>' +
                            '</div>' +
                        '</div>' +
                        '<pre id="plain-text-content"></pre>' +
                    '</div>' +
                    '<div class="feedback-section" id="feedback-section" style="display:none">' +
                        '<p class="feedback-label">How is the OCR quality?</p>' +
                        '<div class="feedback-buttons">' +
                            '<button class="btn-feedback btn-feedback-up" id="feedback-up" title="Good quality">' +
                                ICONS.thumbsUp + '<span>Looks good</span>' +
                            '</button>' +
                            '<button class="btn-feedback btn-feedback-down" id="feedback-down" title="Poor quality">' +
                                ICONS.thumbsDown + '<span>Needs work</span>' +
                            '</button>' +
                        '</div>' +
                        '<p class="feedback-thanks" id="feedback-thanks" style="display:none">Thank you for your feedback!</p>' +
                    '</div>' +
                '</div>';
        }

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            var file = fileInput.files[0];
            if (!file) return;

            if (isPdf) return;

            uploadError.style.display = 'none';

            if (pendingDataUrl) showSkeleton(pendingDataUrl);
            submitBtn.disabled = true;
            if (currentSrc) { currentSrc.close(); currentSrc = null; }

            var formData = new FormData();
            formData.append('file', file);

            try {
                var resp = await fetch('/transcribe', { method: 'POST', body: formData });
                var data = await resp.json();
                if (!resp.ok) throw new Error(data.detail || data.error || 'Upload failed');
                currentJobId = data.job_id;
                showCancelButton(data.job_id);
                if (data.queue_position && data.queue_position > 1) {
                    setStatus('Position ' + data.queue_position + ' in queue…');
                } else if (!data.cached) {
                    setStatus('Segmenting document…');
                }
                startStream(data.job_id);
            } catch (err) {
                resultEl.innerHTML = '';
                uploadError.textContent = err.message;
                uploadError.style.display = '';
                submitBtn.disabled = false;
            }
        });

        function setStatus(text) {
            var el = document.getElementById('line-count');
            if (el) el.textContent = text;
        }

        function showCancelButton(jobId) {
            var btn = document.getElementById('cancel-btn');
            if (!btn) return;
            btn.style.display = '';
            btn.onclick = function () {
                fetch('/cancel/' + jobId, { method: 'POST' });
                if (currentSrc) { currentSrc.close(); currentSrc = null; }
                resultEl.innerHTML = '<div class="cancelled-msg">Request cancelled.</div>';
                submitBtn.disabled = false;
            };
        }

        function hideCancelButton() {
            var btn = document.getElementById('cancel-btn');
            if (btn) btn.style.display = 'none';
        }

        function showDonateButton(jobId) {
            var section = document.querySelector('.result-section');
            if (!section || document.getElementById('donate-section')) return;
            var div = document.createElement('div');
            div.id = 'donate-section';
            div.className = 'donate-section';
            div.innerHTML =
                '<p class="donate-text">Help improve Icelandic OCR — share this image ' +
                'anonymously with the research team.</p>' +
                '<button class="btn-donate" id="donate-btn">Donate image</button>';
            section.insertBefore(div, document.getElementById('feedback-section'));
            document.getElementById('donate-btn').addEventListener('click', function () {
                fetch('/donate/' + jobId, { method: 'POST' }).then(function () {
                    var sec = document.getElementById('donate-section');
                    if (sec) sec.innerHTML =
                        '<p class="donate-thanks">Thank you for contributing!</p>';
                });
            });
        }

        function showFeedback(jobId) {
            var section = document.getElementById('feedback-section');
            if (!section) return;
            section.style.display = '';
            var upBtn = document.getElementById('feedback-up');
            var downBtn = document.getElementById('feedback-down');
            var thanks = document.getElementById('feedback-thanks');

            function sendFeedback(rating) {
                fetch('/feedback/' + jobId, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({rating: rating}),
                });
                upBtn.style.display = 'none';
                downBtn.style.display = 'none';
                thanks.style.display = '';
            }

            upBtn.onclick = function () { sendFeedback('thumbs_up'); };
            downBtn.onclick = function () { sendFeedback('thumbs_down'); };
        }

        function startStream(jobId) {
            var src = new EventSource('/stream/' + jobId);
            currentSrc = src;
            var totalConfidence = 0;
            var confidenceCount = 0;

            src.addEventListener('queue', function (e) {
                var pos = parseInt(e.data);
                setStatus(pos === 1 ? 'Next in queue…' : 'Position ' + pos + ' in queue…');
            });

            src.addEventListener('init', function (e) {
                var panel = document.getElementById('transcription-panel');
                if (panel) panel.innerHTML = e.data;
                setStatus('Recognizing lines…');
            });

            src.addEventListener('line', function (e) {
                var data = JSON.parse(e.data);
                var svg = document.getElementById('transcription-svg');
                if (svg) svg.insertAdjacentHTML('beforeend', data.svg);
                var pre = document.getElementById('plain-text-content');
                if (pre) pre.textContent += data.text + '\n';
                var el = document.getElementById('line-count');
                if (el) {
                    var n = parseInt(el.dataset.count || '0') + 1;
                    el.dataset.count = n;
                    el.textContent = n + ' lines recognized…';
                }
                if (data.avg_confidence != null) {
                    totalConfidence += data.avg_confidence;
                    confidenceCount++;
                }
            });

            src.addEventListener('done', function (e) {
                setStatus(e.data + ' lines detected');
                hideCancelButton();
                submitBtn.disabled = false;
                showDonateButton(jobId);
                showFeedback(jobId);

                var confEl = document.getElementById('confidence-display');
                if (confEl && confidenceCount > 0) {
                    var avg = (totalConfidence / confidenceCount * 100).toFixed(1);
                    var pct = parseFloat(avg);
                    var cls = 'confidence-badge';
                    if (pct >= 90) cls += ' confidence-high';
                    else if (pct >= 70) cls += ' confidence-medium';
                    else cls += ' confidence-low';
                    confEl.className = cls;
                    confEl.textContent = 'Avg confidence: ' + avg + '%';
                    confEl.style.display = '';
                }

                src.close();
                currentSrc = null;
            });

            src.addEventListener('job-error', function (e) {
                resultEl.innerHTML = '<div class="error-msg">Error: ' + e.data + '</div>';
                submitBtn.disabled = false;
                src.close();
                currentSrc = null;
            });

            src.onerror = function () {
                src.close();
                currentSrc = null;
                submitBtn.disabled = false;
            };
        }

        document.addEventListener('click', function (e) {
            var btn = e.target.closest('#copy-btn');
            if (!btn) return;
            var pre = document.getElementById('plain-text-content');
            if (!pre || !pre.textContent) return;
            navigator.clipboard.writeText(pre.textContent).then(function () {
                btn.classList.add('copied');
                setTimeout(function () { btn.classList.remove('copied'); }, 2000);
            });
        });

        document.addEventListener('click', function (e) {
            var btn = e.target.closest('#download-btn');
            if (!btn) return;
            var pre = document.getElementById('plain-text-content');
            if (!pre || !pre.textContent) return;
            var blob = new Blob([pre.textContent], { type: 'text/plain' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'ocr-result.txt';
            a.click();
            URL.revokeObjectURL(url);
        });
    })();
    </script>
</body>
</html>
